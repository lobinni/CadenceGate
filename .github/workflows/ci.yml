name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm ci
      - run: python3 -m unittest discover -s tests -v
      - run: npx tsx --test tests/sdk.test.ts
      - run: npx tsx scripts/schema.ts
      - run: npx tsc --noEmit
      - run: npm run build

  live-verification:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm ci
      - name: Read-only replay of recorded evidence
        run: npx tsx scripts/verify.ts
        env:
          CADENCEGATE_ADDRESS: 0xBCA8c56FD5D2f8dcABA997FDc601b0A4E5CF2E32
